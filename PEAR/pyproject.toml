[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pear-dataset"
version = "0.1.0"
description = "Loading and validation utilities for the PEAR dataset"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
